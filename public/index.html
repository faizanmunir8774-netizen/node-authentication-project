<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Node Auth</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="auth-card">

            <div class="header">
                <h1>Welcome</h1>
                <p>Login or create an account to continue</p>
            </div>


            <!-- Login/Register Tabs -->

            <div class="tabs">

                <button id="loginTab" class="tab active">
                    Login
                </button>

                <button id="registerTab" class="tab">
                    Register
                </button>

            </div>


            <!-- Login -->

            <div id="loginSection">

                <form id="loginForm">

                    <div class="input-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="eye-button"
                                id="loginPasswordToggle"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <button class="main-button" type="submit">
                        Login
                    </button>

                </form>

                <p id="loginMessage" class="message"></p>

                <p class="switch-text">
                    Don't have an account?

                    <button id="registerLink">
                        Register
                    </button>
                </p>

            </div>


            <!-- Register -->

            <div id="registerSection" class="hidden">

                <form id="registerForm">

                    <div class="input-group">

                        <label for="registerName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Minimum 6 characters"
                                required
                            >

                            <button
                                type="button"
                                class="eye-button"
                                id="registerPasswordToggle"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <button class="main-button" type="submit">
                        Create Account
                    </button>

                </form>

                <p id="registerMessage" class="message"></p>

                <p class="switch-text">
                    Already have an account?

                    <button id="loginLink">
                        Login
                    </button>
                </p>

            </div>


            <!-- Profile -->

            <div id="profileSection" class="hidden">

                <div class="profile-header">

                    <h2>My Profile</h2>

                    <p>
                        Your account information
                    </p>

                </div>


                <div class="profile-info">

                    <div class="profile-item">

                        <span class="profile-label">
                            Name
                        </span>

                        <span id="profileName">
                        </span>

                    </div>


                    <div class="profile-item">

                        <span class="profile-label">
                            Email
                        </span>

                        <span id="profileEmail">
                        </span>

                    </div>

                </div>


                <!-- Tasks Section -->
                <div class="tasks-container">

                    <h3>My Tasks</h3>

                    <div class="task-input-group">
                        <input
                            type="text"
                            id="taskInput"
                            placeholder="Add a new task..."
                        >
                        <button id="addTaskBtn" class="add-btn">
                            Add
                        </button>
                    </div>

                    <p id="taskMessage" class="message"></p>

                    <ul id="taskList"></ul>

                </div>


                <button
                    id="logoutButton"
                    class="main-button"
                >
                    Logout
                </button>

                <p
                    id="profileMessage"
                    class="message"
                ></p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
